{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Datapath | Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css" integrity="sha384-gfdkjb5BdAXd+lj+gudLWI+BXq4IuLW5IT+brZEZsLFm++aCMlF1V92rMkPaX4PP" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/dc5b1c7fce.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="{% static 'css/index_css/register.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/fonts.css' %}">
    <link rel="shortcut icon" type="img/ico" href="{% static 'img/page_icon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/estiloregistro.css' %}"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Math&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="contenedor">
      <img class="imgfondo" src="{% static 'img/aaaaa.jpg' %}" alt="Fondo">
       <div class="recuadro"></div>


      <div class="container h-100">
        <div class="d-flex justify-content-center h-100">
          <div class="user_card">
            <div class="d-flex justify-content-center">
              <h3 id="form-title" align="center">Crea tu cuenta</h3>
            </div>
            <div class="d-flex justify-content-center form_container">
              <form method="POST" action=""> {% csrf_token %}
                <div class="input-group mb-2" required>
                  <div class="input-group-append">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                  </div>
                  {{form.first_name}}
                </div>
                <div class="input-group mb-2">
                  <div class="input-group-append">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                  </div>
                  {{form.last_name}}
                </div>
                <div class="input-group mb-2">
                  <div class="input-group-append">
                    <span class="input-group-text"><i class="fa-solid fa-id-card fa-xs"></i></span>
                  </div>
                  {{form.username}}
                </div>
                <div class="input-group mb-2">
                  <div class="input-group-append">
                    <span class="input-group-text"><i class="fas fa-envelope fa-sm"></i></span>
                  </div>
                  {{form.email}}
                </div>
                <div class="input-group mb-2">
                  <div class="input-group-append">
                    <span class="input-group-text"><i class="fas fa-key fa-sm"></i></span>
                  </div>
                  {{form.password1}}
                </div>
                <div class="input-group mb-2">
                  <div class="input-group-append">
                    <span class="input-group-text"><i class="fas fa-key fa-sm"></i></span>
                  </div>
                  {{form.password2}}
                </div>
                <!-- -->                                                                 <!-- o simplemente image/* para cualquier tipo de archivo -->
                <div class="d-flex justify-content-center mt-3 login_container">
                  <a href="/registerForm/{{user.username}}"><input class="btn login_btn" type="submit" value="Crear Cuenta ➤"></a>
                </div>
              </form>
            </div>
            <div style="color:rgb(255, 255, 255);">
              {{ form.errors }}
            </div>
            <div class="mt-4">
              <div style="color: #1d1b33;" class="d-flex justify-content-center links">
                ¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="ml-2">Iniciar Sesión</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
						/* Because i didnt set placeholder values in forms.py they will be set here using vanilla Javascript
		//We start indexing at one because CSRF_token is considered and input field 
		 */

		//Query All input fields
      var form_fields = document.getElementsByTagName('input')
      form_fields[1].placeholder='Nombre/s';
      form_fields[2].placeholder='Apellido/s';
      form_fields[3].placeholder='Nombre de usuario';
      form_fields[4].placeholder='Correo electrónico';
      form_fields[5].placeholder='Contraseña';
      form_fields[6].placeholder='Reescribe la contraseña';

      for (var field in form_fields){
        form_fields[field].className += ' form-control'
      }

    </script>
  </body>
</html>
